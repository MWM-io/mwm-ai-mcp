name: Validate public distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'MWM-io/mwm-ai-mcp'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate the exported tree
        run: python3 scripts/check-public.py
      - name: Check Claude directory rules and OpenAI compatibility
        run: |
          python3 scripts/check-claude-package.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build packages
        run: |
          python3 scripts/build-plugin-zip.py
          python3 scripts/build-plugin-zip.py --format claude
          python3 scripts/build-plugin-zip.py --format submission
      - uses: actions/upload-artifact@v7
        with:
          name: mwm-ai-plugin-packages
          path: dist/*.zip
          if-no-files-found: error
